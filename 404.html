
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Stackly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="error-page-root">

    <!-- CORE 404 INTERFACE CANVAS -->
    <main class="error-canvas-wrapper">
        <div class="error-inner-box">
            
            <!-- Creative Animated Vector Icon Grid Stack -->
            <div class="error-vector-stage">
                <div class="error-ambient-halo"></div>
                
                <!-- SVG Vector Illustration Profile -->
                <svg class="error-illustration-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                
                <h1 class="error-giant-code">404</h1>
            </div>

            <!-- Content Copy Stack -->
            <div class="error-text-stack">
                <h2 class="error-main-heading">Lost in Space?</h2>
                <p class="error-description">
                    The dish, menu blueprint tracking file, or operational directory link you requested cannot be found in our database records. Let's return you to active channels.
                </p>
            </div>

            <!-- REQUESTED FEATURE: Precise Dual Re-routing Actions Group Buttons -->
            <div class="error-buttons-action-group">
                
                <!-- Smart Back button executing target anchor memory relocation macro -->
                <button type="button" class="btn-error-redirect outlined-back-btn" id="smart-back-button-trigger">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>RETURN TO PREVIOUS SECTION</span>
                </button>

                <!-- Home button directing traffic safely back to root index -->
                <a href="index.html" class="btn-error-redirect solid-home-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span>BACK TO HOME PAGE</span>
                </a>

            </div>

        </div>
    </main>

  <style>
    /* --- Ultra-Clean 404 Fallback Section Layout Styles --- */
.error-page-root {
    background-color: #ffffff; /* Pristine white design canvas backdrop matching your domain theme */
    margin: 0; padding: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

.error-canvas-wrapper {
    width: 100%;
    padding: 50px 20px 30px 20px; /* Precise requested top/bottom padding constraints profile */
}

.error-inner-box {
    max-width: 540px;
    margin: 0 auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* --- Creative Visual Vector Stage Canvas --- */
.error-vector-stage {
    position: relative;
    width: 100%;
    height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
}

.error-ambient-halo {
    position: absolute;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(230, 92, 64, 0.06) 0%, transparent 70%); /* Soft support brand coral glow */
    border-radius: 50%;
    z-index: 1;
    pointer-events: none;
}

.error-illustration-svg {
    width: 64px; height: 64px;
    color: #e65c40; /* Stackly Core Coral Token */
    position: relative;
    z-index: 2;
    margin-bottom: 12px;
    animation: spatialVectorFloat 4s ease-in-out infinite alternate;
}

@keyframes spatialVectorFloat {
    0% { transform: translateY(0); }
    100% { transform: translateY(-8px); }
}

.error-giant-code {
    font-size: 3.5rem;
    font-weight: 900;
    color: #111827; /* Solid absolute crisp high-contrast black heading text */
    letter-spacing: -1px;
    line-height: 1;
    margin: 0;
    position: relative;
    z-index: 2;
}

/* --- Typography Content Hierarchy --- */
.error-text-stack {
    margin-bottom: 35px;
}

.error-main-heading {
    font-size: 1.6rem;
    font-weight: 800;
    color: #111827;
    margin: 0 0 12px 0;
}

.error-description {
    font-size: 0.98rem;
    color: #4a5568; /* Balanced neutral grey context line readability copy */
    line-height: 1.6;
    margin: 0;
    max-width: 440px;
}

/* --- Action Buttons Layout Flex Grid --- */
.error-buttons-action-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
}

.btn-error-redirect {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 24px;
    border-radius: 30px; /* Fluid high-contrast absolute pill blocks buttons shapes layout */
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    box-sizing: border-box;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.btn-error-redirect svg { width: 15px; height: 14px; stroke: currentColor; fill: none; }

/* Outlined Back Button Profile Parameters */
.outlined-back-btn {
    background-color: transparent;
    border: 1px solid #cbd5e1;
    color: #4a5568;
}

.outlined-back-btn:hover {
    border-color: #111827;
    color: #111827;
    background-color: #f8fafc;
}

/* Solid Home Button Profile Parameters */
.solid-home-btn {
    background-color: #111827; /* Corporate high-contrast deep blue-black plate */
    color: #ffffff;
    border: none;
    box-shadow: 0 4px 12px rgba(17, 24, 39, 0.1);
}

.solid-home-btn:hover {
    background-color: #e65c40; /* Smooth hover transition directly into core brand coral accent */
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(230, 92, 64, 0.2);
}

/* --- Full Fluid Cross-Device Breakpoints Media Queries --- */
@media (max-width: 480px) {
    .error-canvas-wrapper { padding: 40px 15px 30px 15px; }
    .error-giant-code { font-size: 3rem; }
    .error-main-heading { font-size: 1.4rem; }
    .btn-error-redirect { padding: 14px 18px; font-size: 0.8rem; letter-spacing: 0.5px; }
}

  </style>

  <script>
    // --- Smart 404 Anchor Memory Section-Wise Navigation Back Trigger Script ---
document.addEventListener("DOMContentLoaded", () => {
    
    // Select the smart back shortcut button trigger handle selector node
    const smartBackBtnTrigger = document.getElementById("smart-back-button-trigger");

    if (smartBackBtnTrigger) {
        smartBackBtnTrigger.addEventListener("click", () => {
            // Fetch raw layout directory history referrer string channel path memory
            const historyReferrerUrlString = document.referrer;

            // Evaluate if an historical origin navigation path exists securely inside context channel bounds
            if (historyReferrerUrlString && historyReferrerUrlString !== "") {
                // Returns browser traffic natively straight back to the precise last URL path and active section anchor hash location matrix
                window.location.href = historyReferrerUrlString;
            } else {
                // Safe absolute micro fallback: execute browser layout window backward trace check loops
                window.history.back();
            }
        });
    }
});

  </script>
</body>
</html>
